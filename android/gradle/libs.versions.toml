# Dependency versions, in one place so an update is one edit.
#
# Every version here was checked against its actual current release on
# 2026-07-31 rather than taken from a document. See DECISIONS.md D15 for what
# was chosen and why, including why the target SDK is what it is.

[versions]
agp = "9.4.0"
kotlin = "2.4.10"  # For the Compose compiler plugin only. AGP 9 brings its own Kotlin support.
# 2026.08.00 rather than 2026.06.01, and the reason is the line below it.
# material3 1.5.0-alpha26 asks for Compose UI 1.12.0-beta01, and the older bom
# pinned 1.11.4, so the alpha would have pulled the whole UI stack onto a beta
# behind the bom's back. This bom pins 1.12.0 stable, which is higher, so
# **one artifact is off the stable channel rather than seven.** D179.
composeBom = "2026.08.00"
# **Material 3 Expressive is not in a stable material3 yet, and this is the
# whole reason for an alpha in this build.** The bom resolves material3 to
# 1.4.0, where `MaterialExpressiveTheme` and `MotionScheme` are `internal` and
# `ButtonGroup`, `SplitButton`, `FloatingToolbar`, `LoadingIndicator` and
# `MaterialShapes` do not exist at all. Verified by compiling against it on
# 2026-08-16, not by reading a release note. D179.
#
# Checked against dl.google.com the same day: 1.4.0 is the newest stable and
# 1.5.0-alpha26 the newest release of any kind. Nothing between them.
material3 = "1.5.0-alpha26"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
sqlite = "2.7.0"
sqlcipher = "4.17.0"
# Bouncy Castle, for Argon2id only. D51.
bouncycastle = "1.85.2"
work = "2.11.2"
coroutines = "1.11.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# **The one library that names its own version against the bom.** The bom is
# still the source of truth for every other Compose artifact; this one is
# pinned past it because the interface is being built on Material 3 Expressive
# and the bom's material3 does not carry it. D179.
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

# The database. androidx.sqlite gives the SupportSQLite interfaces, SQLCipher
# provides the encrypted implementation behind them. There is deliberately no
# Room here: Room means declaring the schema in Kotlin, and the schema lives in
# contract/schema.sql. See DECISIONS.md D16.
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
# The provider jar, not the full one. Argon2BytesGenerator is pure Java and
# needs no native library. AES-256-GCM comes from the platform JCE. D51.
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
