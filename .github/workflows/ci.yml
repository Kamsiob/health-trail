name: CI

# Runs on every push and every pull request. Two reasons this is worth having
# beyond the obvious: compiling every test source set is what enforces the rule
# that suites must actually compile, since an instrumented suite nobody builds
# rots silently and looks like coverage while providing none. And the content
# compliance checks are the app's own promises about medical advice,
# interpretation, and what leaves the device, written as tests rather than
# upheld by intention.
#
# This workflow covers what genuinely exists. It grows as the app does, rather
# than carrying steps that fail for reasons that are not defects: a badge
# showing a state the build cannot reach is worse than no badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Content compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the compliance checks
        run: python3 tools/checks/run_all.py

      - name: The generated catalog matches the template data
        # CATALOG.md is generated from data/*.json and must never be hand
        # edited. If regenerating it produces a diff, someone edited the
        # generated file, and the two have already disagreed.
        run: |
          python3 templates/build-catalog.py
          if ! git diff --quiet -- templates/CATALOG.md; then
            echo "::error file=templates/CATALOG.md::CATALOG.md does not match templates/data. It is generated, not written. Edit the JSON and run python3 templates/build-catalog.py"
            git diff -- templates/CATALOG.md
            exit 1
          fi
          echo "CATALOG.md matches the template data."

  documentation:
    name: Documentation is honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The handoff check below diffs the pull request against its base, and
          # the default shallow clone does not contain the base commit. Without
          # this the step fails with "bad object" on every pull request, which
          # looks like a defect in the change rather than in the workflow.
          fetch-depth: 0

      - name: Every required document exists
        # Template section A1. A public repository missing these looks
        # unfinished regardless of the code inside.
        run: |
          missing=0
          for f in README.md ARCHITECTURE.md CONTRIBUTING.md SECURITY.md \
                   CODE_OF_CONDUCT.md PRIVACY.md CHANGELOG.md LICENSE \
                   MASTER_SPEC.md DESIGN.md HANDOFF.md DECISIONS.md \
                   contract/DATA-CONTRACT.md .github/FUNDING.yml \
                   .github/PULL_REQUEST_TEMPLATE.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required document missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: HANDOFF.md is current to within one increment
        # RUN-SAFETY.md section 7. A commit that changes code and leaves the
        # handoff stale is an incomplete commit, because the handoff is what a
        # session with no memory inherits.
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          code_changed=$(echo "$changed" | grep -E '^(android|web|tools|contract)/' || true)
          handoff_changed=$(echo "$changed" | grep -x 'HANDOFF.md' || true)
          if [ -n "$code_changed" ] && [ -z "$handoff_changed" ]; then
            echo "::error file=HANDOFF.md::This pull request changes code but does not update HANDOFF.md. The same commit that changes the code changes the handoff."
            echo "Changed:"
            echo "$code_changed"
            exit 1
          fi
          echo "HANDOFF.md discipline satisfied."

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the compile platform
        # compileSdk is 37 and the runner image does not necessarily carry it.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: The build fails loudly when the shared contract is missing
        # The data contract says the build must fail rather than fall back to a
        # stale internal copy. That behavior is itself a requirement, so it is
        # tested rather than trusted: the schema is moved aside, the build is
        # expected to fail, and it is put back.
        working-directory: android
        run: |
          mv ../contract/schema.sql ../contract/schema.sql.hidden
          if ./gradlew --quiet help > /tmp/contract-check.log 2>&1; then
            mv ../contract/schema.sql.hidden ../contract/schema.sql
            echo "::error::The build succeeded with contract/schema.sql missing. It must fail instead, or the app can silently run against nothing."
            exit 1
          fi
          mv ../contract/schema.sql.hidden ../contract/schema.sql
          if ! grep -q "cannot read the shared contract" /tmp/contract-check.log; then
            echo "::error::The build failed without the message that explains why. The failure has to name the missing file and say there is nothing to fall back to."
            cat /tmp/contract-check.log
            exit 1
          fi
          echo "The build refuses to run without the contract, and says why."

      - name: Assemble
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Compile the instrumented suite
        # Compiled but not run here. Running it needs an emulator, which is a
        # separate job. Compiling it is what stops it rotting: an instrumented
        # suite nobody builds looks like coverage while providing none.
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: The schema in the built app matches the contract file
        # A byte comparison, because the copy step is exactly the kind of wiring
        # that breaks quietly.
        run: |
          python3 - <<'CHECK'
          import hashlib, sys, zipfile
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          inside = hashlib.sha256(zipfile.ZipFile(apk).read("assets/contract/schema.sql")).hexdigest()
          on_disk = hashlib.sha256(open("contract/schema.sql", "rb").read()).hexdigest()
          if inside != on_disk:
              print(f"::error::The schema inside the app differs from contract/schema.sql")
              sys.exit(1)
          print("The schema in the app is the contract file, unchanged.")
          CHECK

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
