# Dependency updates, acted on rather than left to accumulate.
#
# Only ecosystems that genuinely exist are listed. The Gradle entry arrives with
# the Android project under issue #11, because Dependabot reports an error for a
# directory it cannot find, and a permanently erroring configuration is the same
# failure as a permanently red badge.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - "type:task"
      - "area:repo"
    open-pull-requests-limit: 5

  # The Android project, which now exists. **This is what owns staying
  # current**, since lint's two version checks were turned off for making a
  # third party's release schedule into a red build on an unchanged tree.
  # D121. A pull request naming the version is reviewable and testable; a
  # failing `lintDebug` at three in the morning is neither.
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - "type:task"
      - "area:repo"
    open-pull-requests-limit: 5
